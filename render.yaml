services:
  - type: web
    name: smart-traffic-management
    env: node
    buildCommand: npm install && npm run build && npm run db:push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: traffic-db
          property: connectionString

databases:
  - name: traffic-db
    plan: free
